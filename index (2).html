<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Raahiq — Your Ride. Your Way.</title>
<style>
:root{--ink:#142432;--muted:#687782;--teal:#087f70;--bg:#f7f9f9;--line:#e8eded}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:#e7eeee;color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.app{max-width:460px;margin:auto;min-height:100dvh;background:#f9fbfa;position:relative;overflow:hidden;box-shadow:0 0 45px #143c3930}.top{position:absolute;z-index:5;top:0;left:0;right:0;padding:calc(17px + env(safe-area-inset-top)) 20px 14px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}.top>*{pointer-events:auto}.brand{font-size:27px;font-weight:850;letter-spacing:-1.5px}.brand span{color:var(--teal)}.round{border:0;background:#fff;box-shadow:0 3px 15px #193e3620;width:44px;height:44px;border-radius:50%;font-size:20px}.map{height:54dvh;min-height:360px;position:relative;overflow:hidden;background:#e7eee9}.map svg{width:100%;height:100%;display:block}.map-label{position:absolute;top:105px;left:20px;border-radius:22px;background:#fff;padding:9px 12px;font-size:12px;box-shadow:0 3px 18px #24443918;color:#355b50}.location{position:absolute;right:18px;bottom:95px;border:0;background:#fff;border-radius:50%;height:46px;width:46px;box-shadow:0 4px 15px #203d4024;font-size:21px}.sheet{position:relative;margin-top:-53px;background:#fff;border-radius:28px 28px 0 0;padding:11px 21px 98px;min-height:53dvh;box-shadow:0 -6px 28px #153e3611}.handle{width:36px;height:5px;border-radius:10px;background:#dce4e1;margin:0 auto 19px}.title{font-size:24px;font-weight:820;letter-spacing:-.8px;margin:0 0 5px}.sub{color:var(--muted);font-size:13px;margin:0 0 20px;line-height:1.5}.search{display:flex;align-items:center;gap:12px;background:#f3f6f5;border:1px solid #e9eeee;border-radius:15px;padding:15px;margin:12px 0;color:#7b8988}.search input{width:100%;border:0;outline:0;background:transparent;color:var(--ink);font-size:15px}.search .dot{width:10px;height:10px;background:var(--teal);border-radius:50%;flex-shrink:0}.search .end{background:#263a4a;border-radius:2px}.services{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0 23px}.service{border:1px solid #e5eeeb;background:#f8faf9;border-radius:17px;padding:15px 5px;text-align:center;font-weight:700;font-size:12px}.service .emoji{display:block;font-size:27px;margin-bottom:9px}.service.active{background:#e8f5f0;border-color:#94cdbd;color:#056d5e}.sectionhead{display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:800;margin:20px 0 10px}.muted{color:var(--muted);font-size:12px;font-weight:500}.saved{display:flex;gap:11px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);font-size:14px}.saved small{display:block;color:var(--muted);margin-top:3px}.bottom{position:absolute;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #eef1f0;display:flex;justify-content:space-around;padding:12px 4px calc(11px + env(safe-area-inset-bottom));z-index:8}.nav{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:#81908e;min-width:65px}.nav .ico{font-size:21px}.nav.active{color:var(--teal);font-weight:800}.screen{padding:calc(85px + env(safe-area-inset-top)) 21px 110px;min-height:100dvh;background:#fff}.screen h2{font-size:26px;letter-spacing:-.8px;margin:0 0 7px}.back{border:0;background:#f0f4f2;border-radius:50%;height:42px;width:42px;font-size:20px;margin-bottom:20px}.field{display:block;margin:15px 0 5px;font-size:12px;font-weight:800;color:#586b70}.entry{border:1px solid #e0e8e6;border-radius:13px;padding:14px;width:100%;background:#f9fbfa;outline-color:var(--teal)}.primary{border:0;border-radius:15px;background:#0b806f;color:#fff;font-weight:800;padding:16px 18px;width:100%;margin-top:15px;font-size:15px}.outline{border:1px solid #cbded7;border-radius:14px;background:#fff;color:#126d60;font-weight:750;padding:12px 16px}.choice{display:flex;align-items:center;gap:14px;border:1.5px solid #e6eeeb;border-radius:16px;padding:13px;margin:9px 0;cursor:pointer}.choice.active{border-color:#0b947c;background:#f0faf6}.vehicle{font-size:28px;background:#f3f7f5;border-radius:12px;width:59px;height:53px;display:grid;place-items:center}.choice .name{font-weight:800;font-size:15px}.choice .detail{font-size:12px;color:var(--muted);margin-top:4px}.choice .price{margin-left:auto;font-weight:850;font-size:18px}.pill{display:inline-block;border-radius:30px;background:#e8f4f0;color:#087663;font-size:11px;font-weight:800;padding:6px 10px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.card{border:1px solid #e6eeeb;border-radius:18px;padding:17px;margin:14px 0;background:#fff}.tabs{display:flex;gap:7px;margin:18px 0}.tab{flex:1;border:1px solid #e3ebe7;border-radius:12px;background:#f8faf9;padding:11px 5px;font-size:12px;font-weight:750}.tab.active{background:#0b806f;color:white;border-color:#0b806f}.tour{border:1px solid #e4eae8;border-radius:19px;overflow:hidden;margin:14px 0}.tour-art{height:120px;background:linear-gradient(145deg,#b7dbd3,#3f7b79);display:flex;align-items:center;justify-content:center;font-size:54px}.tour-body{padding:15px}.info{background:#f0f7f4;border-radius:13px;padding:14px;font-size:13px;line-height:1.6;color:#3e5b56}.progress{display:flex;gap:5px;margin:20px 0}.progress span{flex:1;height:5px;background:#e6eeeb;border-radius:10px}.progress .on{background:#0b806f}.empty{text-align:center;padding:35px 10px;color:#697b79}.empty .big{font-size:46px;margin-bottom:12px}.small{font-size:12px;color:#667a77;line-height:1.5}.mapOverlay{position:absolute;left:20px;right:20px;bottom:85px;background:#fff;border-radius:15px;padding:14px;box-shadow:0 5px 25px #183a3724;font-size:13px}.notice{font-size:11px;color:#7d8988;text-align:center;margin:14px 0}.hidden{display:none!important}@media(min-width:700px){.app{margin:20px auto;min-height:850px;border-radius:26px}.map{height:470px}.sheet{min-height:450px}.screen{min-height:850px}.bottom{position:sticky;bottom:0}} 

#authGate{position:fixed;z-index:1000;inset:0;background:#f7f9f9;display:flex;align-items:center;justify-content:center;padding:22px}#authGate .login{max-width:400px;width:100%;background:white;border:1px solid #e4ece9;padding:26px;border-radius:22px;box-shadow:0 12px 40px #14342b14}#authGate input{width:100%;border:1px solid #d9e5e1;border-radius:12px;padding:14px;margin:7px 0}#authGate button{width:100%;border:0;border-radius:12px;padding:15px;background:#087f70;color:white;font-weight:750;margin-top:12px}.syncBanner{padding:9px 14px;background:#e8f8f2;font-size:12px;text-align:center;color:#075d51}.syncBanner.error{background:#fff0e9;color:#993d22}
</style></head><body><div id="authGate"><div class="login"><h1 style="color:#087f70">raahiq.</h1><h2>Customer test login</h2><p>Sign in with your Firebase customer test account.</p><input id="loginEmail" type="email" placeholder="Email" autocomplete="username"><input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password"><button onclick="customerLogin()">Sign in</button><p id="loginError" style="color:#b33;font-size:13px"></p></div></div><main class="app" id="app"><div id="syncBanner" class="syncBanner">Connecting to Firebase…</div><div id="view"></div><nav class="bottom" id="bottom"></nav></main>
<script>
const rides=[['Bike','🏍️','1 passenger',89],['Auto','🛺','Up to 3 passengers',149],['Sedan','🚕','4 passengers',259],['Premium Sedan','🚘','4 passengers',369],['MPV / SUV','🚙','Depends on registered seats',459],['Traveller','🚐','Up to 12 passengers',899]];
const tours=[['Dooars Escape','🌳','2 days · Transport only',3499],['Darjeeling Getaway','🏔️','3 days · Full holiday',8999],['Bhutan Discovery','🏯','5 days · Full holiday · permits required',18999],['North Bengal Explorer','🌄','3 days · Transport only',6499]];
const state={page:'home',mode:'local',pickup:'Jaigaon (demo pickup)',drop:'',ride:2,trip:'One way',date:'',returnDate:'',payment:'Cash',booking:null,package:null,pinX:310,pinY:190,pinSelected:false};
const $=id=>document.getElementById(id);const money=n=>'₹'+Number(n).toLocaleString('en-IN');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon={home:'⌂',rides:'🚕',tours:'🏔',payments:'▣',profile:'☻'};
function go(page){state.page=page;render();window.scrollTo(0,0)}function nav(){return ['home','rides','tours','payments','profile'].map(p=>`<button class="nav ${state.page===p?'active':''}" onclick="go('${p}')"><span class="ico">${icon[p]}</span>${p[0].toUpperCase()+p.slice(1)}</button>`).join('')}
function map(){return `<div class="map"><svg viewBox="0 0 460 480" preserveAspectRatio="xMidYMid slice"><rect width="460" height="480" fill="#eaf0eb"/><path d="M-30 60L500 125M-20 210L500 278M-30 367L500 420M70 -30L120 520M230 -30L280 520M395 -30L445 520" stroke="#fff" stroke-width="30"/><path d="M-30 60L500 125M-20 210L500 278M-30 367L500 420M70 -30L120 520M230 -30L280 520M395 -30L445 520" stroke="#d3ded8" stroke-width="1.5"/><path d="M-30 160L500 195M-30 310L500 340M-20 460L500 10" stroke="#fff" stroke-width="13"/><path d="M-30 160L500 195M-30 310L500 340M-20 460L500 10" stroke="#d7e1dc" stroke-width="1"/><path d="M20 15L85 22L70 125L12 112ZM300 290L368 301L355 362L290 355ZM160 335L205 340L215 385L170 382Z" fill="#d3e6d4"/><text x="166" y="95" fill="#9baea6" font-size="12">JAIGAON</text><text x="285" y="225" fill="#9baea6" font-size="11">MAIN ROAD</text><text x="30" y="310" fill="#9baea6" font-size="11">MARKET</text><path d="M122 300Q182 250 242 285T380 185" fill="none" stroke="#0b907c" stroke-width="6" stroke-linecap="round" stroke-dasharray="${state.page==='tracking'?'0':'8 8'}"/><circle cx="122" cy="300" r="18" fill="#0b907c" opacity=".16"/><circle cx="122" cy="300" r="9" fill="#0b907c" stroke="white" stroke-width="4"/><circle cx="380" cy="185" r="8" fill="#173b49" stroke="#fff" stroke-width="3"/></svg><div class="map-label">● &nbsp; Explore rides near you</div><button class="location" onclick="alert('Real GPS will be connected in a later development phase.')">◎</button></div>`}
function home(){return `<header class="top"><div class="brand">raahiq<span>.</span></div><button class="round" onclick="go('profile')">☻</button></header>${map()}<section class="sheet"><div class="handle"></div><h1 class="title">Where to today?</h1><p class="sub">Your journey, made simple.</p><div class="search" onclick="go('route')"><span>⌕</span><strong style="color:#536662;font-weight:600">Where would you like to go?</strong><span style="margin-left:auto">→</span></div><div class="services"><button class="service" onclick="state.mode='local';go('route')"><span class="emoji">🚕</span>Local rides</button><button class="service" onclick="state.mode='outstation';go('route')"><span class="emoji">🛣️</span>Outstation</button><button class="service" onclick="go('tours')"><span class="emoji">🏔️</span>Tours</button></div><div class="sectionhead">Your shortcuts <span class="muted">Quick access</span></div><div class="saved" onclick="state.drop='Hasimara';go('route')"><span>📍</span><div><b>Hasimara</b><small>Popular nearby destination</small></div><span style="margin-left:auto">›</span></div><div class="saved" onclick="state.drop='Siliguri';state.mode='outstation';go('route')"><span>🛣️</span><div><b>Siliguri</b><small>Plan an outstation ride</small></div><span style="margin-left:auto">›</span></div></section>`}
function route(){return `<section class="screen" style="padding-top:calc(70px + env(safe-area-inset-top))"><button class="back" onclick="go('home')">‹</button><h2>Where do you want to go?</h2><p class="sub">Search for your destination or move the pin on the map.</p>${state.mode==='outstation'?`<div class="tabs">${['One way','Round trip','Multi-day'].map(t=>`<button class="tab ${state.trip===t?'active':''}" onclick="state.trip='${t}';render()">${t}</button>`).join('')}</div>`:''}<div class="search" style="margin-bottom:8px"><span class="dot"></span><input id="pickup" aria-label="Pickup location" placeholder="Pickup location" value="${esc(state.pickup)}"></div><div class="search" style="margin-top:8px"><span class="dot end"></span><input id="drop" aria-label="Destination" placeholder="Search destination" value="${esc(state.drop)}" oninput="destinationTyped(this.value)"></div><div class="pin-map" id="pinMap" style="position:relative;height:310px;border-radius:20px;overflow:hidden;margin:16px 0;background:#e9f0eb;touch-action:none"><svg viewBox="0 0 460 310" preserveAspectRatio="none" style="width:100%;height:100%"><rect width="460" height="310" fill="#e9f0eb"/><path d="M-10 40L470 100M-10 190L470 245M80 -10L145 320M250 -10L290 320M400 -10L440 320" stroke="white" stroke-width="24"/><path d="M-10 40L470 100M-10 190L470 245M80 -10L145 320M250 -10L290 320M400 -10L440 320" stroke="#d0dfd8" stroke-width="1"/><path d="M-10 285L470 15" stroke="white" stroke-width="13"/><path d="M-10 285L470 15" stroke="#d0dfd8" stroke-width="1"/><rect x="25" y="118" width="70" height="44" rx="8" fill="#cde5d4"/><rect x="315" y="255" width="95" height="38" rx="8" fill="#cde5d4"/><text x="32" y="30" font-size="12" fill="#7b9a8e">JAIGAON · DEMO MAP</text><path id="routePreview" d="M120 230 L${state.pinX} ${state.pinY}" stroke="#087f70" stroke-width="5" stroke-dasharray="7 7" fill="none"/><circle cx="120" cy="230" r="10" fill="#0b806f" stroke="white" stroke-width="4"/><g id="destinationPin" transform="translate(${state.pinX} ${state.pinY})"><path d="M0 -29C-23 -29 -23 1 0 18C23 1 23 -29 0 -29Z" fill="#142f40" stroke="white" stroke-width="3"/><circle cy="-12" r="6" fill="white"/></g></svg><div style="position:absolute;left:12px;bottom:12px;background:white;border-radius:12px;padding:10px 12px;font-size:12px;box-shadow:0 2px 10px #0001">📍 Drag anywhere to set destination</div></div><p class="small" id="pinInfo">${state.pinSelected?'Map pin selected (demo coordinates)':'Drag the destination pin to choose a map point.'} Search text and map pin are alternative ways to choose your drop.</p><div class="row" style="margin-top:15px"><label style="font-size:13px;font-weight:750">Schedule for later</label><input type="datetime-local" id="date" value="${esc(state.date)}" style="max-width:195px;border:1px solid #e0e8e6;border-radius:9px;padding:9px;font-size:12px"></div>${state.mode==='outstation'&&state.trip!=='One way'?`<label class="field">RETURN DATE</label><input class="entry" id="returnDate" type="date" value="${esc(state.returnDate)}">`:''}<button class="primary" onclick="saveRoute()">See vehicles & fares →</button><p class="notice">Demo map only. Real address search, pin-to-address lookup and road-route pricing require mapping services.</p></section>`}
function destinationTyped(v){state.drop=v;state.pinSelected=false;const info=$('pinInfo');if(info)info.textContent='Destination entered. A real app will show address suggestions and locate it on the map.'}
function setPinFromEvent(e){const map=$('pinMap');if(!map)return;const r=map.getBoundingClientRect();state.pinX=Math.max(18,Math.min(442,(e.clientX-r.left)/r.width*460));state.pinY=Math.max(25,Math.min(292,(e.clientY-r.top)/r.height*310));state.pinSelected=true;state.drop='Pinned location (demo)';const input=$('drop');if(input)input.value=state.drop;const pin=$('destinationPin');if(pin)pin.setAttribute('transform',`translate(${state.pinX} ${state.pinY})`);const line=$('routePreview');if(line)line.setAttribute('d',`M120 230 L${state.pinX} ${state.pinY}`);const info=$('pinInfo');if(info)info.textContent='Pin selected. The real app will resolve this point to an address and calculate a road route.'}
function saveRoute(){state.pickup=$('pickup').value.trim();state.drop=$('drop').value.trim();state.date=$('date').value;const r=$('returnDate');if(r)state.returnDate=r.value;if(!state.pickup||!state.drop){alert('Choose a pickup and destination using search or the map pin.');return}go('choose')}
function choose(){return `<section class="screen"><button class="back" onclick="go('route')">‹</button><h2>Choose your ride</h2><p class="sub">${esc(state.pickup)} → ${esc(state.drop)}</p><span class="pill">All eligible ride types</span><div style="margin-top:18px">${rides.map((r,i)=>`<div class="choice ${state.ride===i?'active':''}" onclick="state.ride=${i};render()"><div class="vehicle">${r[1]}</div><div><div class="name">${r[0]}</div><div class="detail">${r[2]}</div><div class="detail">Sample fare · route pricing not connected</div></div><div class="price">${money(r[3])}</div></div>`).join('')}</div><div class="info">ⓘ Prices are sample amounts, not distance-based quotes. Availability, legal eligibility and passenger capacity must be checked before launch.</div><button class="primary" onclick="go('review')">Continue with ${rides[state.ride][0]} →</button></section>`}
function review(){return `<section class="screen"><button class="back" onclick="go('choose')">‹</button><h2>Review your ride</h2><p class="sub">Everything in one place before you confirm.</p><div class="card"><div class="row"><b>${rides[state.ride][1]} ${rides[state.ride][0]}</b><b>${money(rides[state.ride][3])}</b></div><hr style="border:0;border-top:1px solid #e8eeee;margin:16px 0"><div class="saved"><span>🟢</span><div><b>${esc(state.pickup)}</b><small>Pickup</small></div></div><div class="saved"><span>📍</span><div><b>${esc(state.drop)}</b><small>Destination</small></div></div>${state.date?`<p class="small">Scheduled for ${esc(state.date.replace('T',' '))}</p>`:''}${state.mode==='outstation'?`<p class="small">${esc(state.trip)} ${state.returnDate?'· Return '+esc(state.returnDate):''}</p>`:''}</div><div class="sectionhead">Payment method</div><div class="tabs">${['Cash','UPI'].map(t=>`<button class="tab ${state.payment===t?'active':''}" onclick="state.payment='${t}';render()">${t}</button>`).join('')}</div><div class="info">This test sends a real request to your test driver via Firestore. No payment is collected; fare and map are samples.</div><button class="primary" onclick="book()">Send live test booking</button></section>`}
async function book(){if(!window.raahiqUser){alert('Sign in to book');return}const b={customerUid:window.raahiqUser.uid,driverUid:'sjtv7K4hMSYzeAoYh4f0A7F0u153',pickup:state.pickup,drop:state.drop,ride:rides[state.ride][0],fare:rides[state.ride][3],mode:state.mode,payment:state.payment,status:'pending',date:state.date||'',createdAt:Date.now()};try{const id=await window.raahiqCreateRide(b);state.booking={...b,id};go('tracking')}catch(e){alert('Booking not sent: '+e.message)}}
function tracking(){const b=state.booking;return `<header class="top"><div class="brand">raahiq<span>.</span></div><button class="round" onclick="go('rides')">×</button></header>${map()}<section class="sheet"><div class="handle"></div><span class="pill">LIVE FIREBASE TEST</span><h1 class="title" style="margin-top:12px">${esc(b?.status||'Request sent')}</h1><p class="sub">Driver updates appear here automatically while online.</p><div class="card"><b>${esc(b?.ride||'Ride')}</b><p class="small">${esc(b?.pickup||'')} → ${esc(b?.drop||'')}</p><div class="row"><span class="small">Sample fare (not calculated)</span><b>${money(b?.fare||0)}</b></div></div><button class="primary" onclick="go('rides')">View my rides</button></section>`}
function ridesPage(){return `<section class="screen"><h2>My rides</h2><p class="sub">Live test bookings from Firestore.</p>${window.raahiqRides?.length?window.raahiqRides.map(b=>`<div class="card"><div class="row"><b>${esc(b.ride)}</b><span class="pill">${esc(b.status)}</span></div><p class="small">${esc(b.pickup)} → ${esc(b.drop)}</p><div class="row"><span class="small">${esc(b.id.slice(0,8))}</span><b>${money(b.fare)}</b></div></div>`).join(''):`<div class="empty"><div class="big">🚕</div><b>No live rides yet</b><p class="small">Your bookings will appear here.</p><button class="outline" onclick="go('home')">Book a ride</button></div>`}</section>`}
function toursPage(){return `<section class="screen"><h2>Explore tours</h2><p class="sub">From a vehicle for the day to a complete holiday.</p><div class="tabs"><button class="tab active">All packages</button><button class="tab" onclick="alert('Package filters will be connected later.')">Transport only</button><button class="tab" onclick="alert('Package filters will be connected later.')">Full holidays</button></div>${tours.map((t,i)=>`<div class="tour" onclick="state.package=${i};go('tourDetail')"><div class="tour-art">${t[1]}</div><div class="tour-body"><div class="row"><b>${t[0]}</b><b>${money(t[3])}</b></div><p class="small">${t[2]}</p><span class="pill">View package →</span></div></div>`).join('')}<p class="notice">Packages and prices are illustrative, not bookable inventory.</p></section>`}
function tourDetail(){let t=tours[state.package??0];return `<section class="screen"><button class="back" onclick="go('tours')">‹</button><div class="tour-art" style="border-radius:20px;height:185px">${t[1]}</div><h2 style="margin-top:20px">${t[0]}</h2><p class="sub">${t[2]}</p><div class="card"><b>What's included?</b><p class="small">A proposed itinerary with transport and the services listed for this package. Final hotels, meals, permits and sightseeing must be confirmed before a real reservation.</p><div class="row"><span>Illustrative price from</span><b>${money(t[3])}</b></div></div><label class="field">PREFERRED DEPARTURE DATE</label><input class="entry" id="tourDate" type="date"><label class="field">TRAVELLERS</label><input class="entry" id="travellers" type="number" min="1" max="20" value="2"><button class="primary" onclick="tourRequest()">Request a demo booking</button></section>`}
function tourRequest(){const d=$('tourDate').value,n=$('travellers').value;if(!d){alert('Choose a departure date');return}const t=tours[state.package??0];const all=JSON.parse(localStorage.getItem('raahiq_demo_tours')||'[]');all.unshift({name:t[0],date:d,travellers:n});localStorage.setItem('raahiq_demo_tours',JSON.stringify(all));alert('Demo tour request saved on this device. No real booking was placed.');go('tours')}
function payments(){return `<section class="screen"><h2>Payments</h2><p class="sub">Clear, simple payment records.</p><div class="card"><b>Payment methods</b><div class="saved">💵 &nbsp; Cash</div><div class="saved">📱 &nbsp; UPI <span class="pill">Not connected</span></div></div><div class="info">No actual money is collected by this prototype. Receipts and refunds will appear here when the payment backend is connected.</div></section>`}
