<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Raahiq Driver · Live Test</title><style>*{box-sizing:border-box}body{margin:0;background:#eef5f2;font-family:system-ui,-apple-system,sans-serif;color:#19372f}.app{max-width:540px;margin:auto;padding:22px}h1{color:#087f70}input{display:block;width:100%;padding:14px;margin:10px 0;border:1px solid #d3e2dc;border-radius:12px;font:inherit}button{background:#087f70;color:white;border:0;border-radius:12px;padding:13px 18px;font-weight:700;cursor:pointer}button.reject{background:#a73535}button:disabled{opacity:.5}.card{background:white;border-radius:20px;padding:18px;margin:14px 0;box-shadow:0 4px 18px #122b1c10}.small{font-size:13px;color:#6a7974}.pill{background:#e1f3ec;padding:5px 10px;border-radius:20px;font-size:12px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}#loginError,#error{color:#a73535;font-size:13px}</style></head><body><main class="app"><h1>raahiq<span style="color:#183c35">.</span> Driver</h1><p>Live two-phone booking test</p><section id="login"><div class="card"><h2>Driver sign in</h2><input id="email" type="email" placeholder="Driver email"><input id="password" type="password" placeholder="Password"><button id="signIn">Sign in</button><p id="loginError"></p></div></section><section id="dashboard" hidden><div class="row"><span id="who"></span><button id="signOut">Sign out</button></div><p class="small">Keep this page open to receive live ride requests.</p><p id="error"></p><div id="rides">Waiting for bookings…</div></section></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js';
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from 'https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js';
import {getFirestore,collection,query,where,onSnapshot,doc,updateDoc} from 'https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js';
const app=initializeApp({apiKey:'AIzaSyC2rC1KI2jNECqUV4DwSvce_jPgPcPTvgs',authDomain:'raahiq-e4d38.firebaseapp.com',projectId:'raahiq-e4d38',appId:'1:533566974558:web:75e42588a631f0fe3262cf'});const auth=getAuth(app),db=getFirestore(app),driverUID='sjtv7K4hMSYzeAoYh4f0A7F0u153';let unsub=null;const el=id=>document.getElementById(id);const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
el('signIn').onclick=async()=>{try{el('loginError').textContent='';await signInWithEmailAndPassword(auth,el('email').value.trim(),el('password').value)}catch(e){el('loginError').textContent=e.message}};el('signOut').onclick=()=>signOut(auth);
onAuthStateChanged(auth,u=>{if(unsub){unsub();unsub=null}const ok=u&&u.uid===driverUID;el('login').hidden=!!ok;el('dashboard').hidden=!ok;if(!ok){if(u)el('loginError').textContent='This account is not the authorized driver.';return}el('who').textContent=u.email;unsub=onSnapshot(query(collection(db,'rides'),where('driverUid','==',driverUID)),snap=>{const list=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.createdAt-a.createdAt);el('rides').innerHTML=list.length?list.map(b=>`<article class="card"><div class="row"><b>${escape(b.ride)}</b><span class="pill">${escape(b.status)}</span></div><p><b>Pickup:</b> ${escape(b.pickup)}</p><p><b>Drop:</b> ${escape(b.drop)}</p><p class="small">Sample fare ₹${Number(b.fare).toLocaleString('en-IN')} · ${escape(b.payment)}</p>${b.status==='pending'?`<div class="row"><button data-id="${b.id}" data-status="accepted">Accept ride</button><button class="reject" data-id="${b.id}" data-status="rejected">Reject</button></div>`:''}</article>`).join(''):'<div class="card">No bookings yet. Book a ride on Phone 1.</div>';},err=>el('error').textContent='Firestore error: '+err.message)});
el('rides').addEventListener('click',async e=>{const b=e.target.closest('button[data-id]');if(!b)return;b.disabled=true;try{await updateDoc(doc(db,'rides',b.dataset.id),{status:b.dataset.status})}catch(err){el('error').textContent='Update failed: '+err.message;b.disabled=false}});
</script></body></html>
